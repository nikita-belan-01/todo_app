services:
  todo-app-postgres:
    image: postgres:18.1-bookworm
    container_name: todo-app-env-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - todo-app

  todo-app-postgres-migrate:
    image: migrate/migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      todo-app-postgres:
        condition: service_healthy
    networks:
      - todo-app
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todo-app-env-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todo-app-postgres:5432
    ports:
      - "127.0.0.1:${PORT_FORWARD:-}:5432"
    depends_on:
      todo-app-postgres:
        condition: service_healthy
    networks:
      - todo-app

networks:
  todo-app:
    name: todo-app
    driver: bridge
