services:
  todo-app-postgres:
    image: postgres:18.1-bookworm
    container_name: todo-app-env-postgres
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT is not set}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - todo-app

  todo-app-postgres-migrate:
    image: migrate/migrate
    command:
      - -path
      - /migrations
      - -database
      - postgresql://${POSTGRES_USER:?POSTGRES_USER is not set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@todo-app-postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set}?sslmode=disable
      - -verbose
      - up
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT is not set}/migrations:/migrations
    depends_on:
      todo-app-postgres:
        condition: service_healthy
    networks:
      - todo-app
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todo-app-env-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todo-app-postgres:5432
    ports:
      - "127.0.0.1:${PORT_FORWARD:-5432}:5432"
    depends_on:
      todo-app-postgres:
        condition: service_healthy
    networks:
      - todo-app

networks:
  todo-app:
    name: todo-app
    driver: bridge
